<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="cadastrar.css">
    <link rel="stylesheet" href="navbar.css">
      
</head>
<body>

    <div id="navbar"></div>
    
    <main class="container">
        <form  method="post">
            <h1>Cadastro EcoWatt</h1>

            <div class="input-box">
                <input placeholder="Nome" type="text" name="txtNome" required>
            </div>

            <div class="input-box">
                <input placeholder="Email" name="txtLogin" type="email" required>
            </div>

            <div class="input-box">
                <input placeholder="Senha" name="txtSenha" type="password" required>
            </div>

            <input type="submit" class="login" name="b1" value="Cadastrar"/>
        </form>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="navbar.js"></script>
    
</body>
</html>
