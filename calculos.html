<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cálculos</title>

<link rel="stylesheet" href="calculo.css">
<link rel="stylesheet" href="navbar.css">
</head>

<body>

<div id="navbar"></div>

<h1>Cálculos</h1>

<div class="container">
    <div class="bloco">

        <div class="info">
            <h2>Consumo e Emissão</h2>

            <p>
                Calcule o consumo de energia,
                custo mensal e emissão de CO₂
                do uso dos seus aparelhos e IA.
            </p>

            <div class="planeta">
                <div class="terra"></div>
                <div class="folha folha1"></div>
                <div class="folha folha2"></div>
            </div>
            
        </div>
        

        <div class="form">
            <fieldset class="grupo-categoria">
                <legend>Consumo do aparelho</legend>

                <div class="campo">
                    <label>Dispositivo</label>
                    <input type="text" id="dispositivo" placeholder="Geladeira">
                </div>

                <div class="campo">
                    <label>Potência (W)</label>
                    <input type="number" id="potencia" placeholder="300">
                </div>

                <div class="campo">
                    <label>Horas por dia</label>
                    <input type="number" id="horas" placeholder="5">
                </div>
                <div class="campo">
                    <label>Dias no mês</label>
                    <input type="number" id="dias" placeholder="30">
                </div>
            </fieldset>
            <fieldset class="grupo-categoria">
                <legend>Consumo de IA</legend>
                <div class="campo">
                    <label>Uso de IA (h)</label>
                    <input type="number" id="ia" placeholder="2">
                </div>
    
                <div class="campo">
                    <label>Valor do kWh (R$)</label>
                    <input type="number" id="valor" placeholder="0.80">
                </div>
            </fieldset>
            
            <div class="campo full">
                <button onclick="calcular()">
                    Calcular Consumo
                </button>
            </div>

            <div id="resultado" class="resultado"></div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="navbar.js"></script>
<script src="calculos.js"></script>

</body>
</html>
