<!DOCTYPE html>
<html lang="pt-br">
<head>

<title>Resultados</title>

</head>

<body>

<div id="navbar"></div>

<h1>Resultados</h1>

<div class="container">
    <div class="bloco">

        <h2>Resultado do Consumo</h2>

        <div class="conteudo">

           
            <div class="texto">

                <p>
                    ⚡ <strong>Consumo Total</strong><br>
                    <span id="consumo-total">—</span>
                </p>

                <p>
                    💰 <strong>Custo Estimado</strong><br>
                    <span id="custo-estimado">—</span>
                </p>

                <p>
                    🌱 <strong>Emissão de CO₂</strong><br>
                    <span id="emissao-co2">—</span>
                </p>

                <p>
                    🌳 <strong>Compensação</strong><br>
                    <span id="compensacao">—</span>
                </p>

            </div>

            <div class="grafico">
                <canvas id="grafico"></canvas>
            </div>

        </div>

    </div>
</div>

<script src="navbar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</html>
